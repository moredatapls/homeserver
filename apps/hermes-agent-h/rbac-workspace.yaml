apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-h-workspace
  namespace: hermes-agent-h-workspace
  labels:
    app: hermes-agent-h
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-h-workspace
  namespace: hermes-agent-h-workspace
  labels:
    app: hermes-agent-h
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-h-workspace
subjects:
  - kind: ServiceAccount
    name: hermes-h
    namespace: hermes-agent-h
---
# cluster-scoped storage resources, read-only
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-h-storage-read
  labels:
    app: hermes-agent-h
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers", "csinodes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-h-storage-read
  labels:
    app: hermes-agent-h
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-h-storage-read
subjects:
  - kind: ServiceAccount
    name: hermes-h
    namespace: hermes-agent-h
 