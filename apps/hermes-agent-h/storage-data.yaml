apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-h-data
  namespace: hermes-agent-h
  labels:
    app: hermes-agent-h
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hermes-h-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /mnt/data/hermes-agent-h/data
    type: DirectoryOrCreate
  claimRef:
    name: hermes-h-data
    namespace: hermes-agent-h
