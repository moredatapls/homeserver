apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-h-workspace
  namespace: hermes-agent-h-workspace
  labels:
    app: hermes-agent-h
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hermes-h-workspace
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /mnt/data/hermes-agent-h/workspace
    type: DirectoryOrCreate
  claimRef:
    name: hermes-h-workspace
    namespace: hermes-agent-h-workspace
