apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-assistant-matter-volume-backup
  namespace: home-assistant
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: matter-volume-backup
              image: busybox:1.37
              command:
                - sh
                - -c
                - |
                  set -eu
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  snapshot_dir=/backups/matter-volume-snapshots
                  mkdir -p "$snapshot_dir"
                  find "$snapshot_dir" -type f -name '*.tmp' -delete
                  if [ -z "$(ls -A /matterjs)" ]; then
                    echo "Matter.js data volume is empty" >&2
                    exit 1
                  fi
                  matterjs_tmp="$snapshot_dir/.matterjs-${timestamp}.tar.gz.tmp"
                  trap 'rm -f "$matterjs_tmp"' EXIT
                  tar -czf "$matterjs_tmp" -C /matterjs .
                  tar -tzf "$matterjs_tmp" >/dev/null
                  mv "$matterjs_tmp" "$snapshot_dir/matterjs-${timestamp}.tar.gz"
                  find "$snapshot_dir" -type f -name 'python-matter-*.tar.gz' -delete
                  find "$snapshot_dir" -type f -name '*.tar.gz' -mtime +14 -delete
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: matterjs
                  mountPath: /matterjs
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: matterjs
              persistentVolumeClaim:
                claimName: home-assistant-matterjs
            - name: backups
              persistentVolumeClaim:
                claimName: home-assistant-backups
          restartPolicy: OnFailure
