apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-matterjs
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
  storageClassName: local-storage
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-assistant-matterjs
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  capacity:
    storage: 256Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data/home-assistant/matterjs
    type: DirectoryOrCreate
  claimRef:
    name: home-assistant-matterjs
    namespace: home-assistant
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - alderaan