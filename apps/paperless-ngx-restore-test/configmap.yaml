apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-config
  namespace: paperless-ngx-restore-test
data:
  PAPERLESS_URL: "http://localhost:8000"
  PAPERLESS_TIME_ZONE: "Europe/Berlin"
  PAPERLESS_REDIS: "redis://redis.paperless-ngx-restore-test.svc.cluster.local:6379"
  PAPERLESS_CONSUMPTION_DIR: "../sync/consume"
  PAPERLESS_CONSUMER_POLLING: "15"
  PAPERLESS_CONSUMER_RECURSIVE: "true"
  PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
  PAPERLESS_AI_ENABLED: "false"
