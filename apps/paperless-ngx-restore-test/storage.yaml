apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-restore-test-data
  labels:
    app: paperless-ngx-restore-test
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data/paperless-ngx-secondary/data
    type: DirectoryOrCreate
  claimRef:
    name: paperless-restore-test-data
    namespace: paperless-ngx-restore-test
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - alderaan
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-restore-test-data
  namespace: paperless-ngx-restore-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  volumeName: paperless-restore-test-data
  resources:
    requests:
      storage: 10Gi
---
