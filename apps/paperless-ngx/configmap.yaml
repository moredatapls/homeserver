apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-config
  namespace: paperless-ngx
data:
  # The UID and GID of the user used to run paperless in the container.
  # Uncomment and set this to your UID and GID on the host so that you have write access
  # USERMAP_UID: "1000"
  # USERMAP_GID: "1000"

  # This is required if you will be exposing Paperless-ngx on a public domain
  # Uncomment and adjust as needed
  PAPERLESS_URL: "https://paperless.berlin.bruegner.com"

  # Use this variable to set a timezone for the Paperless Docker containers. Defaults to UTC.
  PAPERLESS_TIME_ZONE: "Europe/Berlin"

  # The default language to use for OCR. Set this to the language most of your documents are written in.
  PAPERLESS_OCR_LANGUAGE: "deu"

  # Additional languages to install for text recognition, separated by a whitespace.
  PAPERLESS_OCR_LANGUAGES: "eng ron"

  # Redis connection string
  PAPERLESS_REDIS: "redis://redis.paperless-ngx.svc.cluster.local:6379"

  # Enable AI features for document processing
  PAPERLESS_AI_ENABLED: "true"
  PAPERLESS_AI_LLM_BACKEND: "openai-like"

  # Preserve v2 behavior of always creating archive files.
  PAPERLESS_ARCHIVE_FILE_GENERATION: "always"

  # Configure the consumer directory
  PAPERLESS_CONSUMPTION_DIR: "../sync/consume"

  # Ignore Nextcloud sync database files; v3 patterns are regular expressions.
  PAPERLESS_CONSUMER_IGNORE_PATTERNS: '["^\\.sync_.*"]'

  # Configure the filename format for exported documents
  PAPERLESS_FILENAME_FORMAT: "{{ document_type }}/{{ correspondent }}/{{ created }}_{{ title }}"

  # Delete detected duplicates
  PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"

  # Enable recursive consumption of documents in the consume directory
  PAPERLESS_CONSUMER_RECURSIVE: "true"

  # Poll the consume directory every 15 seconds.
  PAPERLESS_CONSUMER_POLLING_INTERVAL: "15"

  # Avoid NumPy x86-64-v2 SIGILL on the HP N54L; disables legacy Auto classification.
  PAPERLESS_TRAIN_TASK_CRON: "disable"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-sync-config
  namespace: paperless-ngx
data:
  backup-excludes.txt: |
    .paperless-backup-*
