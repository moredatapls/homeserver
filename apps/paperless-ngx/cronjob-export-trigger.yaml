# this pod executes the document_exporter command in the paperless-ngx container
# this will sync to a folder that will be synced to nextcloud
# documentation here: https://docs.paperless-ngx.com/administration/#exporter
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-export-trigger
  namespace: paperless-ngx
spec:
  # trigger nightly at 2am
  schedule: "0 2 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: export-trigger
          containers:
            - name: export-trigger
              image: alpine/kubectl:latest
              command:
                - /bin/sh
                - -ec
                - |
                  kubectl exec -n paperless-ngx deploy/ui -c paperless-ngx -- /bin/sh -ec '
                    sync=/usr/src/paperless/sync
                    mkdir -p "$sync/export"
                    document_exporter "$sync/export" --use-filename-format --delete --use-folder-prefix --compare-checksums --no-progress-bar
                  '
          restartPolicy: OnFailure
