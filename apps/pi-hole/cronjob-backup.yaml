apiVersion: batch/v1
kind: CronJob
metadata:
  name: pi-hole-backup
  namespace: pi-hole
spec:
  schedule: "0 3 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: export-trigger
          initContainers:
            - name: backup
              image: alpine/kubectl:latest
              command:
                - /bin/sh
                - -ec
                - |
                  kubectl exec -n pi-hole statefulset/server -c server -- /bin/sh -ec '
                    staging=$(mktemp -d /backups/.teleporter-XXXXXX)
                    trap '\''rm -rf "$staging"'\'' EXIT
                    cd "$staging"
                    output=$(pihole-FTL --teleporter)
                    archive=$(printf "%s\n" "$output" | tail -n 1)
                    test -n "$archive"
                    test "$archive" = "$(basename "$archive")"
                    test -s "$archive"
                    chmod 0644 "$archive"
                    mv "$archive" /backups/
                    find /backups -maxdepth 1 -type f -name "pi-hole_*_teleporter_*.zip" -mmin +20160 -delete
                  '
          containers:
            - name: nextcloud-sync
              image: mbentley/nextcloud-client:latest
              env:
                - name: NEXTCLOUD_URL
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-credentials
                      key: url
                - name: USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-credentials
                      key: username
                - name: PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-credentials
                      key: password
                - name: OPTIONS
                  value: "--non-interactive --path /pi-hole/backups --exclude /etc/nextcloud/backup-excludes.txt"
              volumeMounts:
                - name: backups
                  mountPath: /data
                - name: sync-config
                  mountPath: /etc/nextcloud
                  readOnly: true
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: pi-hole-backups
            - name: sync-config
              configMap:
                name: nextcloud-sync-config
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-sync-config
  namespace: pi-hole
data:
  backup-excludes.txt: |
    .teleporter-*