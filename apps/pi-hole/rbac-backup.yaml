apiVersion: v1
kind: ServiceAccount
metadata:
  name: export-trigger
  namespace: pi-hole
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: export-trigger
  namespace: pi-hole
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: export-trigger
  namespace: pi-hole
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: export-trigger
subjects:
  - kind: ServiceAccount
    name: export-trigger
    namespace: pi-hole