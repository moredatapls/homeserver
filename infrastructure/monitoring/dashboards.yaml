apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  # RAID host events
  host-events.json: |
    {
      "uid": "host-events",
      "title": "Host / Events",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "tags": ["host", "mdadm", "raid"],
      "timezone": "browser",
      "refresh": "1m",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "RAID Active / Required Disks",
          "type": "stat",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "node_md_disks{state=\"active\"} / on(instance, device, job, namespace, pod, service, endpoint) node_md_disks_required", "legendFormat": "{{instance}} / {{device}}", "instant": true}
          ],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"colorMode": "value", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "id": 2,
          "title": "RAID Failed Disks",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "node_md_disks{state=\"failed\"}", "legendFormat": "{{instance}} / {{device}}"}
          ],
          "fieldConfig": {"defaults": {"min": 0, "decimals": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        }
      ]
    }
  # kube events
  kube-events.json: |
    {
      "uid": "kube-events",
      "title": "Kubernetes / Events",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "tags": ["kubernetes"],
      "timezone": "browser",
      "refresh": "1m",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Kubernetes Events",
          "type": "logs",
          "gridPos": {"x": 0, "y": 6, "w": 24, "h": 16},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [
            {"refId": "A", "expr": "{cluster=\"berlin\", job=\"kubernetes-events\"} | json", "queryType": "range"}
          ],
          "options": {"showTime": true, "showLabels": false, "wrapLogMessage": true, "sortOrder": "Descending", "dedupStrategy": "none", "enableLogDetails": true}
        },
        {
          "id": 2,
          "title": "Kubernetes Error Events",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 22, "w": 24, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "kube_event_count{cluster=\"berlin\", job=\"kubernetes-events\", type=\"error\"}", "legendFormat": "{{instance}}"}
          ],
          "fieldConfig": {"defaults": {"min": 0, "decimals": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        }
      ]
    }
  # stacked chart of cpu and memory consumption by namespace
  cpu-memory-namespace.json: |
    {
      "uid": "cpu-memory-namespace",
      "title": "Kubernetes / Compute Resources / By Namespace",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "tags": ["kubernetes", "namespace", "cpu", "memory"],
      "timezone": "browser",
      "refresh": "1m",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage by Namespace",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{job=\"kubelet\", image!=\"\"}[5m])) by (namespace)", "legendFormat": "{{namespace}}"}
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic", "seriesBy": "max"},
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.9,
                "drawStyle": "line",
                "fillOpacity": 50,
                "gradientMode": "none",
                "hideFrom": {"legend": false, "tooltip": false, "viz": false},
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineStyle": {"fill": "solid"},
                "lineWidth": 2,
                "pointSize": 1,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "always",
                "showValues": false,
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "normal"},
                "thresholdsStyle": {"mode": "off"}
              },
              "decimals": 2,
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}, {"color": "red", "value": 80}]}
            },
            "overrides": []
          },
          "options": {
            "graphStyle": "areaStacked",
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"hideZeros": false, "mode": "single", "sort": "none"}
          }
        },
        {
          "id": 2,
          "title": "Memory Usage by Namespace",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 8, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "sum(container_memory_usage_bytes{job=\"kubelet\", image!=\"\"}) by (namespace)", "legendFormat": "{{namespace}}"}
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic", "seriesBy": "max"},
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.9,
                "drawStyle": "line",
                "fillOpacity": 50,
                "gradientMode": "none",
                "hideFrom": {"legend": false, "tooltip": false, "viz": false},
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineStyle": {"fill": "solid"},
                "lineWidth": 2,
                "pointSize": 1,
                "scaleDistribution": {"type": "linear"},
                "showPoints": "always",
                "showValues": false,
                "spanNulls": false,
                "stacking": {"group": "A", "mode": "normal"},
                "thresholdsStyle": {"mode": "off"}
              },
              "decimals": 2,
              "min": 0,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": 0}, {"color": "red", "value": 80}]},
              "unit": "decbytes"
            },
            "overrides": []
          },
          "options": {
            "graphStyle": "areaStacked",
            "legend": {"calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"hideZeros": false, "mode": "single", "sort": "none"}
          }
        }
      ]
    }
