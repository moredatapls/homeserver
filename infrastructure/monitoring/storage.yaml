apiVersion: v1
kind: PersistentVolume
metadata:
  name: monitoring-prometheus
  labels:
    monitoring-volume: prometheus
spec:
  capacity:
    storage: 25Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data/monitoring/prometheus
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - alderaan
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: monitoring-grafana
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data/monitoring/grafana
    type: DirectoryOrCreate
  claimRef:
    name: monitoring-grafana
    namespace: monitoring
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - alderaan
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monitoring-grafana
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  volumeName: monitoring-grafana
  resources:
    requests:
      storage: 2Gi
